name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' numpy==2.2.6
      - name: Lint and formatting
        run: |
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Notebook code validation
        run: python scripts/make_notebook.py
      - name: Fresh Linux CPU simulation installation
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          python -m pip install uv==0.10.11
          python scripts/setup_sim.py --env .venv-sim-ci --python 3.12 --torch-index cpu
          .venv-sim-ci/bin/python -c "import torch, numpy; assert torch.version.cuda is None; assert numpy.__version__ == '1.26.4'"
