[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-foundry"
version = "0.1.0"
description = "Reproducible manipulation experiments and official GR00T/SONIC launchers"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.7,<3", "pyarrow>=19,<30", "av==15.1.0", "Pillow>=10,<13", "huggingface-hub>=0.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
robot-foundry = "robot_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

